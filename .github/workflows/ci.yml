name: FounderPilot OS Production Gate CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-truth-and-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Clean dependency installation
        run: npm ci

      - name: Secret scanning & browser secret-input ban check
        run: |
          ! grep -rn "sk_live_" src/
          ! grep -rn 'type="password"' src/

      - name: Strict TypeScript verification
        run: npm run lint

      - name: Production Vite bundle build
        run: npm run build
